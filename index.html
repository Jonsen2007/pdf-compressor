<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Compressor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- JSZip & PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

    <header class="topbar">
        <div class="brand" id="brandHomeBtn" role="button" tabindex="0" title="Terug naar start" data-i18n-title="homeTitle">
            <span class="brand-name">PDF Compressor</span>
        </div>

        <div class="topbar-actions">
            <button id="homeBtn" class="theme-btn" title="Terug naar start" data-i18n-title="homeTitle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>
            <button id="langToggle" class="theme-btn" title="Switch language / Wissel taal">
                <span id="langLabel">NL</span>
            </button>
            <button id="themeToggle" class="theme-btn" title="Schakel thema" data-i18n-title="themeTitle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Melding-toast: gebruikt voor o.a. de "geen geldig PDF-bestand" waarschuwing -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div class="app-container">
        
        <!-- STAP 1: Uploadzone -->
        <section id="uploadScreen" class="upload-section">
            <div class="hero-content">
                <h1 data-i18n="heroTitle">Comprimeer PDF bestanden</h1>
                <p data-i18n="heroSubtitle">Verklein de bestandsgrootte van je documenten in seconden.</p>

                <div class="dropzone-card" id="dropZone">
                    <div class="dropzone-inner">
                        <div class="icon-bubble">📄</div>
                        <h3 data-i18n="dropTitle">Sleep je PDF-bestanden hierheen</h3>
                        <p class="subtext" data-i18n="dropSubtitle">of klik om te bladeren</p>
                        <button class="btn-primary" id="selectBtn" data-i18n="chooseFilesBtn">Kies bestanden</button>
                    </div>
                    <input type="file" id="fileInput" multiple accept="application/pdf">
                </div>
            </div>
        </section>

        <!-- STAP 2: Dashboard Werkruimte -->
        <section id="workspaceScreen" class="workspace-section" style="display: none;">
            
            <div class="files-column">
                <div class="column-header">
                    <h2><span data-i18n="filesLabel">Bestanden</span> (<span id="fileBadge">0</span>)</h2>
                    <button class="btn-secondary" id="addMoreBtn" data-i18n="addMoreBtn">+ Toevoegen</button>
                </div>

                <div class="files-grid" id="filesGrid"></div>

                <div id="resultsSummary" class="summary-box" style="display: none;">
                    <div class="stat-card">
                        <span class="stat-label" data-i18n="statOriginal">Origineel</span>
                        <span class="stat-value" id="sumOrigSize">0 MB</span>
                    </div>
                    <div class="stat-arrow">→</div>
                    <div class="stat-card">
                        <span class="stat-label" data-i18n="statNew">Nieuw</span>
                        <span class="stat-value" id="sumNewSize">0 MB</span>
                    </div>
                    <div class="stat-card highlight">
                        <span class="stat-label" data-i18n="statSavings">Besparing</span>
                        <span class="stat-value" id="sumSavings">0%</span>
                    </div>
                </div>

                <button id="zipBtn" class="btn-success" style="display: none;" data-i18n="zipBtn">
                    📦 Download Alles als ZIP
                </button>
            </div>

            <aside class="sidebar-column">
                <div class="panel">
                    <h3 class="panel-title" data-i18n="panelCompression">Compressie</h3>
                    
                    <div class="options-group">
                        <label class="option-card" data-quality="/screen">
                            <input type="radio" name="quality" value="/screen">
                            <div class="option-text">
                                <strong data-i18n="qMaxTitle">Maximale compressie</strong>
                                <span data-i18n="qMaxDesc">Laagste bestandsgrootte</span>
                            </div>
                        </label>

                        <label class="option-card active" data-quality="/ebook">
                            <input type="radio" name="quality" value="/ebook" checked>
                            <div class="option-text">
                                <strong data-i18n="qRecTitle">Aanbevolen</strong>
                                <span data-i18n="qRecDesc">Goede balans tussen kwaliteit en grootte</span>
                            </div>
                        </label>

                        <label class="option-card" data-quality="/printer">
                            <input type="radio" name="quality" value="/printer">
                            <div class="option-text">
                                <strong data-i18n="qHighTitle">Hoge kwaliteit</strong>
                                <span data-i18n="qHighDesc">Minimale compressie</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="panel-title" data-i18n="panelOptions">Opties</h3>
                    
                    <div class="field">
                        <label for="maxTargetMB" data-i18n="maxSizeLabel">Gewenste max. grootte (MB)</label>
                        <input type="number" id="maxTargetMB" value="10" min="1" max="500">
                    </div>

                    <div class="field">
                        <label for="unitSelect" data-i18n="unitLabel">Eenheid weergave</label>
                        <select id="unitSelect">
                            <option value="auto" selected data-i18n="unitAuto">Automatisch (KB / MB)</option>
                            <option value="KB" data-i18n="unitKB">Altijd KB</option>
                            <option value="MB" data-i18n="unitMB">Altijd MB</option>
                        </select>
                    </div>
                </div>

                <button class="btn-action" id="uploadBtn" data-i18n="startBtn">
                    Start Compressie
                </button>
                <button class="btn-cancel" id="cancelBtn" style="display: none;" data-i18n="cancelBtn">
                    Annuleren
                </button>
            </aside>

        </section>

    </div>

    <script src="pdf-compressor.js"></script>
    <!-- Versie indicator rechtsonderin -->
    <div class="version-label">v0.1.5</div>
</body>
</html>
